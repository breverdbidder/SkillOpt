name: SkillOpt isolated install proof

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONNOUSERSITE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  DO_NOT_TRACK: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  WANDB_MODE: disabled
  WANDB_DISABLED: 'true'
  AZURE_CORE_TRACING_ENABLED: 'false'

jobs:
  install-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout workflow lockfile only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned checkout action
        with:
          path: gate
          persist-credentials: false
      - name: Checkout exact SkillOpt source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned checkout action
        with:
          ref: e4ea6a6771e797ef820cdd8bfea64c57e0481065
          path: source
          persist-credentials: false
      - name: Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned setup-python action
        with:
          python-version: '3.10.12'
      - name: Verify source and lock, install in disposable venv
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = e4ea6a6771e797ef820cdd8bfea64c57e0481065
          test "$(sha256sum gate/ci/skillopt-py310.lock | cut -d' ' -f1)" = d0f99e36b5d987a4f7ad5b631b1107a8429fb8385cd2f7457f7ab382d7030b87
          python -m venv "$RUNNER_TEMP/skillopt-venv"
          . "$RUNNER_TEMP/skillopt-venv/bin/activate"
          python -m pip install --require-hashes --only-binary=:all: -r gate/ci/skillopt-py310.lock
          python -m pip install --no-deps --no-build-isolation ./source
          python -m pip check
      - name: Import and CLI parsing proof only
        shell: bash
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/skillopt-venv/bin/activate"
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import importlib.metadata
          import skillopt
          print('skillopt import: OK')
          print('skillopt version:', importlib.metadata.version('skillopt'))
          PY
          skillopt-train --help > train-help.txt
          skillopt-eval --help > eval-help.txt
          grep -q 'usage:' train-help.txt
          grep -q 'usage:' eval-help.txt
          echo 'skillopt-train --help: OK'
          echo 'skillopt-eval --help: OK'
          # No optimizer, Sleep, transcript, dataset, model or provider call.
